# =============================================================================
# CxSV — shared calling configuration (read by BOTH workflows)
#
# The panel builder (workflow/panel/Snakefile) and the patient scorer
# (workflow/patient/Snakefile) both load this file first, so a patient is
# called exactly as the panel was.
#
# Sections marked [FINGERPRINTED] define which SVs and CxSV loci a genome has.
# They are recorded in the panel release's calling_fingerprint.json, and the
# patient workflow stops if its values differ from the panel's. Changing any of
# them means building a new panel release. Do NOT override them in a site or
# patient config.
#
# All relative paths are relative to the project root (run snakemake there).
# =============================================================================

# ─── Reference ────────────────────────────────────────────────────────────────
# T2T-CHM13v2 with UCSC hs1 contig names (chr1..chrM). CRAM inputs must have
# been encoded against this exact sequence: each CRAM's @SQ M5 tags are checked
# against it, and contig MD5s are part of the fingerprint.
reference: "hs1.fa"

# MD5-keyed htslib cache of `reference` (~3.1 GB for hs1), built once by rule
# build_ref_cache. CRAMs decode from it on any machine, with no network access.
ref_cache: "resources/ref_cache"

# ─── Annotation resources (labels only — never remove a locus) ──────────────
annotation:
  genes_bed:    "resources/genes.final.bed"
  exons_bed:    "resources/exons.filtered.bed"
  repeats_bed:  "resources/repeats.final.bed"
  segdup_bed:   "resources/segdup.final.bed"
  promoter_window: 2000

# ─── Paths ───────────────────────────────────────────────────────────────────
bamfiles_root: "bamfiles"          # directory-mode inputs: bamfiles/<cohort>/*.bam|*.cram
scripts_dir:   "workflow/scripts"

# ─── Threads (not fingerprinted) ─────────────────────────────────────────────
threads:
  samtools:   8
  sv_callers: 32

# ─── caller memory and retries (NOT fingerprinted; scheduling only) ─────────
# Applied by workflow/rules/caller_resources.smk (roadmap item 16m). mem_mb is
# reserved per caller job when snakemake has a memory budget (run_cxsv.sh:
# --resources mem_mb = 90% of the host's RAM); attempt k reserves mem_mb x k.
# Measured 2026-11-12 on BOC_3559 (39x ONT R10.4.1 CRAM, 16 caller threads,
# bundle SIF; docs/RELEASE_AND_BUNDLE.md "Node memory"): SVIM 5.4 GB (betsy and
# athena), Sniffles2 11.8 GB and cuteSV 8.5 GB summed over their worker
# processes. Sniffles2 and cuteSV run one worker per thread; their requests
# allow for the 32-thread default (threads.sv_callers). Total 48 GB.
caller_resources:
  svim:     {mem_mb: 8000, retries: 1}
  sniffles: {mem_mb: 24000}
  cutesv:   {mem_mb: 16000}

# ─── [FINGERPRINTED] SV calling ─────────────────────────────────────────────
sv_params:
  min_sv_len:           50
  min_support:           3
  min_mapq:             20
  cluster_max_distance: 1000

# ─── [FINGERPRINTED] Per-caller quality filtering ───────────────────────────
filter_params:
  min_qual:       10
  svim_min_qual:   5

# ─── [FINGERPRINTED] SURVIVOR merging of the three callers ──────────────────
survivor_params:
  max_dist:              300
  min_callers:             1
  min_callers_consensus:   2

# ─── [FINGERPRINTED] CxSV discovery (per sample) ────────────────────────────
# Criteria C1-C5 and the class are computed on DISTINCT junctions of each
# cluster (workflow/lib/cxsv_classes.py; README "CxSV criteria"): records
# collapsed with junction_params.collapse_distance, SVIM composite inversions
# not counted. Since roadmap item 5 (2026-10-29); panels built before that
# have a different fingerprint and must be rebuilt.
#   min_breakpoints        C1: >= this many junctions, or >= 2 junctions with
#                          >= this many breakends and an INV/BND
#   extreme_min_breakends  breakpoint-count tier (PI criterion 2): intermediate
#                          < 5, extreme > 5 breakpoints (Ly & Cleveland via Helle
#                          et al. 2026); 5 itself is counted intermediate
#   min_interleaved        Chromothripsis_like needs an interleaved component of
#                          this many junctions (PI criterion 1 candidate floor 3-4;
#                          the cancer high-confidence value is 6) ...
#   interleave_alt_min_intra / _inter   ... or >= alt_min_intra interleaved plus
#                          >= alt_min_inter interchromosomal junctions
#   composite_fraction     a single-caller junction at the midpoint of two others
#                          (within max(collapse_distance, this x their distance))
#                          is a composite record and not counted
#   span_link_max          DEL/DUP/INV longer than this are not clustered as one
#   long_span_rule         interval spanning everything inside it (roadmap item 13,
#                          2026-11-04: such records, 89% single-caller, mostly
#                          recurrent and mostly without a read-depth change, put a
#                          median 334 Mb per panel genome into oversized clusters).
#                          exclude = left out of CxSV discovery (they stay junctions
#                          and merged calls); breakends = clustered at their two
#                          breakends only. Listed in cxsv/long_span_records.tsv.
#                          span_link_max equals max_cluster_size, so no cluster that
#                          is not oversized changes. span_link_max 0 = interval rule.
#   max_cluster_size       a cluster spanning more than this is not classified
#                          (FILTERED_oversized_cluster); after item 13 these are
#                          dense runs of SVs in satellite / acrocentric / subtelomeric
#                          sequence (median 1.6 Mb per panel genome)
#   single_caller_bnd_rule merged records left out of CxSV discovery (they stay
#                          junctions and merged calls; listed in
#                          cxsv/single_caller_filtered.tsv). svim_lowq (adopted
#                          2026-11-05, docs/R10_EXCESS.md) = SVIM-only (SUPP_VEC 010)
#                          BND/TRA records with QUAL < svim_min_qual_discovery. A few
#                          panel genomes (chimeric libraries) carry thousands at
#                          SVIM's QUAL floor; clustered with real deletions they made
#                          BND_cluster loci (healthy Tier 1 0.851 -> 0.251 per genome).
#                          keep = none left out (panel-v1.0, panel-v1.1 build
#                          64e10c1b1363); svim_lowq_any, single_bnd = diagnosis only.
#   svim_min_qual_discovery QUAL threshold of the svim_lowq rules
# These are operational, cohort-specific choices, not validated cutoffs.
cxsv_params:
  cluster_distance:  50000
  min_breakpoints:       3
  bnd_window:            1
  chromoanag_min_window: 10000
  chromoanag_max_window: 50000
  chromoanag_min_svs:        3
  max_cluster_size: 500000
  span_link_max:    500000
  long_span_rule:   exclude
  extreme_min_breakends:     6
  min_interleaved:           3
  interleave_alt_min_intra:  3
  interleave_alt_min_inter:  4
  composite_fraction:     0.25
  single_caller_bnd_rule: svim_lowq
  svim_min_qual_discovery:  10

# ─── [FINGERPRINTED] Junction tables (per sample; rules/junctions.smk) ──────
# Every merged SV call becomes a breakpoint junction (docs/JUNCTIONS.md).
# Records of one sample with the same svtype and contigs and both ends within
# collapse_distance bp are one junction (Sniffles2's reciprocal inversion
# breakends, BND/mate pairs). Same scale as survivor_params.max_dist, which
# already merges calls across callers. INS also need lengths within
# ins_len_ratio (shorter/longer).
junction_params:
  collapse_distance: 300
  ins_len_ratio:     0.5

# ─── [FINGERPRINTED] Copy-number track (per sample; rules/cn.smk) ────────────
# Second discovery track (roadmap item 15; docs/CN_LINKAGE.md, Phase 1 evaluation
# docs/CN_LINKAGE_PHASE1.md): copy-number segments from 1 kb binned depth against a
# platform panel-of-normals, SV records attached at segment boundaries with no
# distance limit, copy-number-linked CxSV loci (DUP-TRP/INV-DUP, CN_nested_gain,
# CN_linked_gain, CN_linked_loss, CN_linked_gain_loss). Adds loci, removes none.
#   depth             mosdepth --by bin_bp, reads with MAPQ >= min_mapq, fast mode
#   par               T2T-CHM13v2 pseudo-autosomal regions, 0-based half-open (UCSC hs1
#                     PAR1/PAR2; same as resources/scoring/par.bed): ploidy 2 on a male
#                     chrX, 0 on chrY (counted on chrX)
#   pon_exclude       libraries (cohort/sample_id) kept out of the PoN: the 24 library-QC
#                     flags of item 14 (calibration/library_qc/flagged_v1.1.tsv), listed
#                     here so the PoN membership is part of the fingerprint
#   default_stratum / chemistry_stratum   PoN stratum when the sample sheet has no
#                     cn_stratum / qc_group column (rules/cn.smk, cn_stratum_of)
#   segmentation      cxsv_cn.DEFAULTS: PoN masking, HMM, refinement, nested scan
#   linkage           cxsv_cnlink.CN_DEFAULTS (span_link_max = cxsv_params.span_link_max)
# Phase 1 values; operational choices, not validated cutoffs.
cn_params:
  depth: {bin_bp: 1000, min_mapq: 20}
  par:
    chrX: [[0, 2394410], [153925834, 154259566]]
    chrY: [[0, 2458320], [62122809, 62460029]]
  pon_exclude:
    - 1kGP_ONT_1019_CHM13/HG00268
    - 1kGP_ONT_1019_CHM13/HG01879
    - 1kGP_ONT_1019_CHM13/NA18980
    - 1kGP_ONT_1019_CHM13/NA19238
    - 1kGP_LRSC_ONT_CHM13/HG01303
    - 1kGP_LRSC_ONT_CHM13/HG01860
    - 1kGP_LRSC_ONT_CHM13/HG01867
    - 1kGP_LRSC_ONT_CHM13/HG02301
    - 1kGP_LRSC_ONT_CHM13/HG02321
    - 1kGP_LRSC_ONT_CHM13/HG03224
    - 1kGP_LRSC_ONT_CHM13/HG03514
    - 1kGP_LRSC_ONT_CHM13/HG03680
    - 1kGP_LRSC_ONT_CHM13/HG03788
    - 1kGP_LRSC_ONT_CHM13/HG04107
    - 1kGP_LRSC_ONT_CHM13/HG04176
    - 1kGP_LRSC_ONT_CHM13/NA20847
    - 1kGP_LRSC_ONT_CHM13/HG00126
    - 1kGP_LRSC_ONT_CHM13/HG01459
    - 1kGP_LRSC_ONT_CHM13/HG01511
    - 1kGP_LRSC_ONT_CHM13/HG01522
    - 1kGP_LRSC_ONT_CHM13/HG02190
    - 1kGP_LRSC_ONT_CHM13/HG02215
    - 1kGP_LRSC_ONT_CHM13/HG02379
    - 1kGP_LRSC_ONT_CHM13/HG02623
  default_stratum: {ONT: ONT_1kGP_1019, PACBIO: PacBio_HiFi}
  chemistry_stratum: {R9: ONT_LRSC_R9, R10: ONT_LRSC_R10}
  segmentation:
    min_pon_median: 0.25
    max_pon_relmad: 0.30
    min_pon_genomes: 4
    sex_ratio_male: 0.75          # legacy chrX rule: ploidy of an ambiguous sex call
    # sex call (panel-v1.2-r2; calibration/cn_linkage/sex_survey.py on the 1,619 panel libraries):
    # male = chrX ratio in sex_x_male and chrY ratio >= sex_y_male_min; female = chrX ratio in
    # sex_x_female and chrY ratio <= sex_y_female_max; else ambiguous (autosomes-only PoN member)
    sex_x_male: [0.40, 0.60]       # panel males: median 0.491, robust sd 0.008
    sex_x_female: [0.80, 1.12]     # panel females: median 0.967, robust sd 0.024
    sex_y_male_min: 0.10
    sex_y_female_max: 0.05
    p_change: 0.0001
    outlier: 0.01
    max_cn: 6
    min_bins: 3
    min_cn_delta: 0.6
    refine_kb: 15
    nested_min_seg_kb: 60
    nested_min_kb: 30
    nested_min_z: 6.0
    nested_min_copy: 0.4
  linkage:
    max_gap: 500000
    tol: 10000
    min_cn_record_bp: 10000
    rec_overlap: 0.5
    public_overlap: 0.5
    public_min_genomes: 1
    adjacent_bp: 20000
    inv_other_slack: 100000
