# =============================================================================
# CxSV PANEL BUILDER — workflow settings (loaded after config/calling.yaml)
#
# Background cohorts, one spec each. Inputs per cohort:
#   (default)          every *.bam / *.cram in bamfiles/<name>/
#   samples: <tsv>     sample sheet: sample_id, alignment[, index][, individual_id]
#                      [, platform][, coverage_x]; files may live anywhere and
#                      their indexes must already exist
#   min_coverage: <x>  sample-sheet mode only: keep rows with coverage_x >= x
#   platform: <name>   default platform label (ONT, PACBIO) when a sheet or
#                      directory does not give one per sample
# individual_id is what carrier counts are de-duplicated on: one person in two
# cohorts counts once.
#
# Site-specific cohorts and paths go in an overlay, e.g.
#   config/sites/faulk_lab_panel.yaml
# =============================================================================

panel_results_root: "results/panel"

# Empty here on purpose: cohorts are site-specific. Example:
#   panel_cohorts:
#     my_ont_cohort:              # directory mode: bamfiles/my_ont_cohort/*.bam|*.cram
#       platform: ONT
#     my_sheet_cohort:
#       samples: /path/to/sheet.tsv
#       min_coverage: 17
panel_cohorts: {}

# Registry individuals table (individual_id, sex, superpopulation, ...), e.g.
# /mnt/sargasso1/CxSV/datasets/registry/individuals.tsv. Gives allele numbers
# for chrX/chrY (sex) and the per-superpopulation frequencies (af_<group>) of
# the panel junction sites. Unset: sex unknown, no superpopulation groups.
panel_individuals: null

# Panel release identity (roadmap item 2; docs/RELEASE_AND_BUNDLE.md). The
# release id is <name>-<YYYYMMDD>-<first 12 hex digits of the calling
# fingerprint>, fixed the first time it is made (results/panel/panel/release_id.txt)
# and written into every junction-site row's `version` column.
#   date: YYYYMMDD; null = the day the id is first made
#   test_release: true for panels that must never label a real patient (e.g.
#     the 10-genome regression slices); recorded in release.json
release:
  name: "cxsv-panel"
  date: null
  test_release: false
  description: ""

# Callability (rules/panel_callability.smk): per panel sample, mosdepth depth of
# reads with MAPQ >= sv_params.min_mapq; a breakpoint is callable when depth
# >= min_depth over a `flank`-bp window on at least one side of it, a junction
# when both breakpoints are. Not fingerprinted (it describes coverage, it does
# not decide which loci exist); recorded in release.json.
#   min_depth 10: a heterozygous junction then has ~5 supporting reads in
#     expectation, above sv_params.min_support (3); at 17x (the former panel
#     floor; the full panel has none, PI 2026-10-29) most
#     unique sequence passes, collapsed repeats and low-MAPQ segdups do not.
#   flank 100: about one read-anchor length for the callers' split-read
#     signatures; short enough to stay off the other side of a small event.
panel_callability:
  min_depth: 10
  flank: 100
  threads: 4

# Junction sites (scripts/build_panel_sites.py): junctions of different
# individuals are one site when svtype and contigs agree and both ends lie
# within `tolerance` bp of the site's first member (INS: lengths within
# ins_len_ratio). Keep panel_match.tolerance (config/patient.yaml) equal.
panel_sites:
  tolerance: 500
  ins_len_ratio: 0.5

# Sniffles2 population-mode joint genotyping of the per-sample .snf files.
# extra: options for very large panels, e.g. "--combine-max-inmemory-results 2000"
sniffles_population:
  extra: ""
