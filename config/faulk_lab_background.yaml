# =============================================================================
# Faulk lab overlay: the CxSV background panel on the lab NAS.
#
# Layered on top of config/config.yaml (nested keys merge, so the cohorts below
# are ADDED to the ones there):
#   bash scripts/run_pipeline.sh --cohort 1kGP_ONT_1019_CHM13 \
#        --extra-config config/faulk_lab_background.yaml
#
# The sample sheets are generated by the acquisition code
# (acquisition/build_registry.py) from the registry at
# /mnt/sargasso1/CxSV/datasets/registry/; re-run it after new data lands.
# Only verified files (alignment + index present, integrity checked) are listed.
# =============================================================================

reference: "/mnt/sargasso1/CxSV/refs/hs1.fa"
ref_cache: "/mnt/sargasso1/CxSV/refs/ref_cache"

# Annotation BEDs (not in git; see README "Annotation Resources"). Lab copies.
annotation:
  genes_bed:   "/mnt/sargasso1/CxSV/resources/genes.final.bed"
  exons_bed:   "/mnt/sargasso1/CxSV/resources/exons.filtered.bed"
  repeats_bed: "/mnt/sargasso1/CxSV/resources/repeats.final.bed"
  segdup_bed:  "/mnt/sargasso1/CxSV/resources/segdup.final.bed"

cohorts:
  # 1,017 PRJEB89727 runs aligned in-house to hs1 (CRAM). coverage_x is ENA raw
  # yield / 3.1 Gb; 17x is the background-panel floor agreed 2026-10-22.
  1kGP_ONT_1019_CHM13:
    role: reference
    samples: "/mnt/sargasso1/CxSV/datasets/registry/sample_sheets/1kGP_ONT_1019_CHM13.tsv"
    min_coverage: 17
  # 1kGP-LRSC ONT BAMs (held 100 + R10 PMDV + R9 MINIMAP_2026), CHM13-aligned.
  1kGP_LRSC_ONT_CHM13:
    role: reference
    samples: "/mnt/sargasso1/CxSV/datasets/registry/sample_sheets/1kGP_LRSC_ONT_CHM13.tsv"
    min_coverage: 17
  # 1kGP PacBio HiFi BAMs, CHM13-aligned (sheet grows as the download finishes).
  1kGP_PacBio_CHM13:
    role: reference
    samples: "/mnt/sargasso1/CxSV/datasets/registry/sample_sheets/1kGP_PacBio_CHM13.tsv"
    min_coverage: 17
