# =============================================================================
# Faulk lab overlay for the PANEL BUILDER: the background panel on the lab NAS.
#
#   bash scripts/run_pipeline.sh panel --extra-config config/sites/faulk_lab_panel.yaml
#
# The sample sheets are generated by acquisition/build_registry.py from the
# registry at /mnt/sargasso1/CxSV/datasets/registry/; re-run it after new data
# lands. Only verified files (alignment + index present, integrity checked)
# are listed. The sheets carry individual_id and platform per sample.
#
# Carrier counting: one call set per FILE, carriers counted per INDIVIDUAL
# (individual_id). The 35 people sequenced in more than one cohort (33 in two,
# 2 in three; 1,619 files / 1,582 individuals) count once in ac/an and in the
# carrier lists, and once under each platform group they were sequenced on.
# Full build across the lab fleet: docs/PANEL_BUILD.md.
# =============================================================================

reference: "/mnt/sargasso1/CxSV/refs/hs1.fa"
ref_cache: "/mnt/sargasso1/CxSV/refs/ref_cache"

annotation:
  genes_bed:   "/mnt/sargasso1/CxSV/resources/genes.final.bed"
  exons_bed:   "/mnt/sargasso1/CxSV/resources/exons.filtered.bed"
  repeats_bed: "/mnt/sargasso1/CxSV/resources/repeats.final.bed"
  segdup_bed:  "/mnt/sargasso1/CxSV/resources/segdup.final.bed"

panel_results_root: "/mnt/sargasso1/CxSV/results/panel"

# Registry individuals (sex, superpopulation): allele numbers on chrX/chrY and
# the per-superpopulation frequencies of the panel junction sites.
panel_individuals: "/mnt/sargasso1/CxSV/datasets/registry/individuals.tsv"

panel_cohorts:
  # No coverage floor (PI decision 2026-10-29): every verified file of the three
  # cohorts enters the panel, one call set per file. The 17x floor agreed
  # 2026-10-22 is retired; callability masks (release/callability/) record
  # where each low-coverage genome could and could not have seen a junction.
  # The mechanism stays: add `min_coverage: <x>` under a cohort to filter on
  # the sheet's coverage_x column again (workflow/lib/cxsv_inputs.py).
  #
  # 1,017 PRJEB89727 runs aligned in-house to hs1 (CRAM); coverage_x is ENA raw
  # yield / 3.1 Gb (1.4x-61x, median 16.5x).
  1kGP_ONT_1019_CHM13:
    samples: "/mnt/sargasso1/CxSV/datasets/registry/sample_sheets/1kGP_ONT_1019_CHM13.tsv"
    platform: ONT
  # 1kGP-LRSC ONT BAMs (held 100 + R10 PMDV + R9 MINIMAP_2026), CHM13-aligned.
  1kGP_LRSC_ONT_CHM13:
    samples: "/mnt/sargasso1/CxSV/datasets/registry/sample_sheets/1kGP_LRSC_ONT_CHM13.tsv"
    platform: ONT
  # 1kGP PacBio HiFi BAMs, CHM13-aligned.
  1kGP_PacBio_CHM13:
    samples: "/mnt/sargasso1/CxSV/datasets/registry/sample_sheets/1kGP_PacBio_CHM13.tsv"
    platform: PACBIO
