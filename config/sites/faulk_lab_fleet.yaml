# =============================================================================
# Faulk lab fleet for the FULL PANEL BUILD (docs/PANEL_BUILD.md).
#
# Read by scripts/panel_build/make_shards.py (shard sizing and balancing) and
# copied per node into <build>/nodes/<node>/runner.json for
# scripts/panel_build/run_node.py. Each node runs Snakemake inside the pinned
# image on its own shard, in its own working directory; per-sample outputs go
# to disjoint sample directories of one shared results tree on the NAS.
#
# Per node:
#   ssh            "local" for freya (where the launcher runs), else the LAN
#                  alias in freya's ~/.ssh/config
#   threads, ram_gb  hardware (lscpu / free, 2026-10-29)
#   reserve_threads, reserve_ram_gb  left free for other lab work; the runner
#                  never plans past (threads - reserve_threads) busy threads or
#                  starts a sample with less than reserve_ram_gb + one
#                  sample's peak RSS available
#   slots          concurrent samples; "auto" = sized from the cost model
#                  (busy threads and peak RSS per sample) by make_shards.py
#   cores_per_sample  snakemake --cores of one sample instance
#   sv_threads     threads.sv_callers (Sniffles2, cuteSV); SVIM is 1 thread
#   speed          seconds of scripts/panel_build/node_speed.py in the image
#                  (pure-Python, single thread, idle node, 2026-10-29; lower =
#                  faster); a node's per-sample time = freya's measured time x
#                  speed / freya's speed (cost model ref_speed 0.560)
#   nic_mb_s       measured single-stream NAS read rate (nas_throughput.sh)
#   stage_dir      node-local disk for alignment copies (NEVER a RAM tmpfs:
#                  betsy, princess and keurig have /tmp on tmpfs)
#   stage_max_gb   cap on alignment copies held at once
#   stage_bwlimit_mb_s  throttle on this node's NAS copies (0 = none); e.g. 88
#                  on each of 5 nodes keeps the build to ~70% of the NAS
#   tmp_dir        node-local disk bound as /tmp in the container
#   active_hours   "" = always; "18-08" = start new samples only 18:00-08:00
#                  local time (running samples always finish)
#   enabled        false = no shard for this node
# =============================================================================

